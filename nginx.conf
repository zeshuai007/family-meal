server {
  listen 80;
  server_name _;

  # 家庭点菜系统：家味 Family Kitchen
  root /var/www/family-meal;
  index index.html;

  # 开启 gzip，静态资源更省流量
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 静态资源长缓存（文件名不带哈希，如需严格缓存可改为按需加版本号）
  location ~* \.(?:css|js|svg|jpg|jpeg|png|gif|webp|woff2?)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # 单页应用兜底
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 禁止访问隐藏文件
  location ~ /\. {
    deny all;
  }
}
